name: E2E Tests

# ---------------------------------------------------------------------------
# Runs the Playwright smoke suite on every push to main and on every PR
# targeting main.  This catches regressions before they reach a tag/deploy.
#
# The suite builds the static bundle fresh with `astro build` and serves it
# via `astro preview`, so tests always exercise the real SSG output.
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Install Chromium and its OS-level dependencies in one step.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          CI: true

      # Always upload artifacts so failures are diagnosable even when the job
      # exits non-zero.  The artifact name includes the commit SHA so every
      # run has its own evidence slot (QA-001 artifact-retention requirement).
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
