name: E2E Tests

# ---------------------------------------------------------------------------
# Runs the Playwright smoke suite on every PR targeting main.  This is the
# pre-merge gate: it catches regressions before they land on main.
#
# Push-to-main coverage is handled by the deploy workflow (deploy.yml), which
# gates the deploy job on the same E2E suite.  Running both workflows on push
# would duplicate the work; scope them so they compose rather than overlap:
#   - PR → e2e.yml (pre-merge gate, no deploy)
#   - push to main → deploy.yml (build + E2E gate → deploy)
#
# The suite builds the static bundle fresh with `astro build` and serves it
# via `astro preview`, so tests always exercise the real SSG output.
# ---------------------------------------------------------------------------
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # PERF-006: media pipeline guard — validates on every push/PR.
  # Builds the site and checks that no delivered raster exceeds 500 KB,
  # every manifest entry has intrinsic dimensions, no duplicate hashes
  # exist, and no large asset is unreferenced in the built output.
  media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Astro
        run: pnpm run build

      - name: Check media pipeline
        run: pnpm run check-media

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Install Chromium and its OS-level dependencies in one step.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          CI: true

      # Always upload artifacts so failures are diagnosable even when the job
      # exits non-zero.  The artifact name includes the commit SHA so every
      # run has its own evidence slot (QA-001 artifact-retention requirement).
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
