name: Deploy to GitHub Pages

# ---------------------------------------------------------------------------
# Deploys on every push to main (after build + E2E gates pass) and on manual
# dispatch.  `workflow_dispatch` keeps a "Run workflow" button in the Actions
# tab as an escape hatch.
#
# The deploy job is gated on both the build job and the e2e job, so a broken
# build or failing smoke tests will block the deploy without wasting a Pages
# slot.
#
# See docs/DEPLOY.md for the full runbook.
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; newer tags cancel in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This repo uses pnpm (packageManager is pinned in package.json).
      # setup-node's `cache: pnpm` needs pnpm on PATH first, so install it here.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Astro
        run: pnpm run build

      # Minimal self-contained dist gates before publishing. The full gate
      # battery (budgets, OG cards, CSP hashes, html-validate, Lighthouse,
      # Playwright matrix) runs in ci.yml on the same push; these two are the
      # cheap last line of defense so deploy can never ship a broken artifact.
      - name: Internal link check
        run: node scripts/check-links.mjs dist

      - name: Asset size gate
        run: node scripts/check-asset-sizes.mjs dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ---------------------------------------------------------------------------
  # QA-002: Full release-gate E2E — all tests, no grep filter (chromium project).
  #
  # Runs the complete Playwright suite against the production-built app.
  # This is the comprehensive release-candidate gate required before any deploy.
  # It covers all QA-002 acceptance criteria:
  #   • no-JS (homepage + per inner route)
  #   • no-WebGL stub (getContext returns null → authored fallback)
  #   • Forced WebGL context loss (WEBGL_lose_context extension, PERF-010)
  #   • Reduced motion (fresh, persisted, mid-session flip — A11Y-001/EXP-002)
  #   • First-viewport mobile navigation (320/375/430 px — ENG-006)
  #   • History traversal (multi-step chain + icon URL regression)
  #   • HTTP 404 status with branded page and recovery links (ENG-008)
  #   • Keyboard-only walk (skip links, SPA focus, StarMarker Escape — A11Y-006)
  #   • Zero console errors and zero failed requests per route (QA-001)
  #   • Mobile-width overflow matrix (320–430 px, 100%/200% zoom — EXP-012)
  #   • Landmark structure per route (A11Y-002)
  #   • Semantic narrative and live-region safety (A11Y-003)
  #   • Loader interruptibility contract (EXP-006)
  #   • Opening controls (skip-experience — EXP-005)
  #   • Cross-route transitions under reduced motion (EXP-014)
  #   • Reflow matrix — all routes × 48 viewport combinations (EXP-012)
  #   • Three.js absent from inner routes (PERF-002)
  #   • WebGL context count cap across navigation (PERF-001)
  #   • Writing orientation system (EXP-016)
  #   • Nebular writing map (EXP-027)
  #   • Graveyard forensic record (EXP-030)
  #   • Finale proof paths (EXP-008)
  #   • Mobile scroll-track height (ENG-007)
  #   • Budget-table overflow at 320 px (ENG-005)
  #
  # The webServer in playwright.config.ts builds the static bundle with
  # `astro build` and serves it via `astro preview`, so the tests exercise
  # the same SSG output that the build job uploads to GitHub Pages.
  #
  # build and e2e run in parallel; deploy waits for both to succeed.
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Install Chromium and its OS-level dependencies in one step.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      # QA-002: Full release-gate — runs all tests via the `chromium` project
      # (no grep filter).  The smoke subset is already a strict subset of these
      # tests; passing this gate means ALL QA-002 criteria are satisfied.
      - name: Run full release-gate E2E tests
        run: pnpm run test:e2e
        env:
          CI: true

      # Always upload artifacts so failures are diagnosable even when the job
      # exits non-zero.  The artifact name includes the commit SHA so every
      # release has its own evidence slot (QA-001/QA-002 artifact-retention).
      - name: Upload E2E release-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-gate-artifacts-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
