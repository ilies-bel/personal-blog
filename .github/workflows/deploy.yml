name: Deploy to GitHub Pages

# ---------------------------------------------------------------------------
# Deploys ONLY on version tags (v1.0.0, v2.3.1, …), not on every push to main.
# Day-to-day commits to main no longer burn CI minutes; a deploy is an explicit
# act — you cut a tag when you want the site to go live. `workflow_dispatch`
# keeps a manual "Run workflow" button in the Actions tab as an escape hatch.
#
#   # cut a release and publish it:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# See docs/DEPLOY.md for the full runbook.
# ---------------------------------------------------------------------------
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; newer tags cancel in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This repo uses pnpm (packageManager is pinned in package.json).
      # setup-node's `cache: pnpm` needs pnpm on PATH first, so install it here.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Astro
        run: pnpm run build

      # PERF-006: validate the media pipeline — fails if any delivered raster
      # exceeds 500 KB without an approval entry, if a manifest output lacks
      # intrinsic dimensions, if content-hash duplicates exist, or if an asset
      # ≥ 100 KB is in dist/ but unreferenced in any HTML/CSS/JS.
      - name: Check media pipeline
        run: pnpm run check-media

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ---------------------------------------------------------------------------
  # E2E gate — blocks the deploy job.
  #
  # Runs the full Playwright smoke suite against the production-built app.
  # The webServer in playwright.config.ts builds the static bundle with
  # `astro build` and serves it via `astro preview`, so the tests exercise
  # the same SSG output that the build job uploads to GitHub Pages.
  #
  # build and e2e run in parallel; deploy waits for both to succeed.
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Install Chromium and its OS-level dependencies in one step.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          CI: true

      # Always upload artifacts so failures are diagnosable even when the job
      # exits non-zero.  The artifact name includes the commit SHA so every
      # release has its own evidence slot (QA-001 artifact-retention requirement).
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
