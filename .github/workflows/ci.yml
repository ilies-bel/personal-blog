name: CI

# Quality gates on every push and pull request. Deploys stay tag-triggered in
# deploy.yml; this workflow never publishes anything — it exists so nothing
# broken can reach a release tag unnoticed.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests, knip, build gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (astro check)
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Knip (unused files/exports/deps)
        run: pnpm knip

      - name: Build
        run: pnpm build

      - name: Internal link check
        run: node scripts/check-links.mjs dist

      - name: Asset size gate
        run: node scripts/check-asset-sizes.mjs dist

      - name: HTML validation
        run: npx html-validate "dist/**/*.html"

      - name: Upload dist for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  e2e:
    name: Playwright E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E suite
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 7
