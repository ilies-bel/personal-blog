name: CI

# Quality gates on every push and pull request. Deploys stay tag-triggered in
# deploy.yml; this workflow never publishes anything — it exists so nothing
# broken can reach a release tag unnoticed.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests, knip, build gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (astro check)
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Knip (unused files/exports/deps)
        run: pnpm knip

      - name: Build
        run: pnpm build

      - name: Internal link check
        run: node scripts/check-links.mjs dist

      - name: Asset size gate
        run: node scripts/check-asset-sizes.mjs dist

      - name: Bundle budget gate (budgets.json)
        # gzip JS/HTML budgets over dist: hero engine graph, per-route eager
        # JS (engine vs reading routes), per-page HTML. Deterministic bytes —
        # safe to hard-enforce on any runner. Budgets live in budgets.json.
        run: node scripts/check-bundle-budgets.mjs dist

      - name: Perf report staleness gate
        # The committed src/data/perf-report.json (rendered on
        # /behind-the-build) must match the just-built dist within ±5% — the
        # page cannot claim numbers the build no longer produces. Fix locally:
        # pnpm build && node scripts/gen-perf-report.mjs && pnpm build, commit.
        run: node scripts/gen-perf-report.mjs --check dist

      - name: Public raster optimization gate
        # Fails if a raster committed to public/ would shrink >10% under the
        # optimizer — i.e. someone bypassed the image pipeline. Fix locally:
        # `node scripts/optimize-public-images.mjs` and commit the result.
        run: node scripts/optimize-public-images.mjs --check

      - name: Figure capture staleness gate
        run: node scripts/check-figure-staleness.mjs

      - name: CSP hash staleness gate
        # The CSP documented in docs/SECURITY-HEADERS.md (pasted into the
        # Cloudflare Response Header Transform rule) allows each inline script
        # by sha256 hash. Those hashes change whenever an inline script's bytes
        # change (BaseHead pre-paint script edits, Astro upgrades, island
        # directive changes) — this gate fails when the committed doc no longer
        # matches the built dist. Fix locally: pnpm build &&
        # node scripts/gen-csp-hashes.mjs, commit the doc, and re-paste the
        # updated CSP into the Cloudflare rule (see the doc's instructions).
        run: node scripts/gen-csp-hashes.mjs --check dist

      - name: HTML validation
        run: npx html-validate "dist/**/*.html"

      - name: Upload dist for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  lighthouse:
    name: Lighthouse CI (lab metrics)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Lighthouse CI (lhci autorun)
        # Assertion severities are set in lighthouserc.cjs: CLS ≤0.02 is a hard
        # error (deterministic); LCP/TBT/byte-weight are WARN because GitHub
        # runners render through software GL, where wall-clock lab numbers
        # measure the runner. They harden to errors when the pipeline gets real
        # hardware (docs/roadmaps/acceptance-gates.md tracks that promotion).
        run: pnpm lhci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7

  e2e:
    name: Playwright E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E suite
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 7
